stages:
  - build

variables:
  VERSION: $CI_COMMIT_REF_SLUG
workflow:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        VERSION: latest
    - when: always

.docker login:
  before_script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD

build backend:
  stage: build
  image: docker:29
  extends:
    - .docker login
  script:
    - docker buildx build -t $CI_REGISTRY_IMAGE/backend:$VERSION --push ./backend

build frontend:
  stage: build
  image: docker:29
  extends:
    - .docker login
  script:
    - docker buildx build -t $CI_REGISTRY_IMAGE/frontend:$VERSION --push -f ./frontend/prod.Dockerfile ./frontend

stages:
  - check
  - build before
  - lint
  - build
  - deploy
  - cleanup

variables:
  IMAGE_VERSION: $CI_COMMIT_SHA

workflow:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        VERSION: latest
    - if: $CI_COMMIT_REF_NAME == "main"
      variables:
        VERSION: main
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        VERSION: mr$CI_MERGE_REQUEST_IID
    - when: always

.docker login:
  before_script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD

.kubeconfig setup:
  before_script:
    - mkdir "$HOME/.kube"
    - echo "$KUBECONFIG_CONTENT" | base64 -d > "$HOME/.kube/config"

build util image:
  stage: build before
  image: docker:29
  extends: .docker login
  script:
    - >
      docker buildx build
      -t $CI_REGISTRY_IMAGE/util:latest
      --push --provenance=false -f ./docker/util.Dockerfile .
  rules:
    - changes: 
      - docker/util.Dockerfile

check gitignore:
  stage: check
  image: alpine:latest
  script:
    - apk add --no-cache git
    - ./scripts/git-verify-ignore.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

check git size diff:
  stage: check
  image: alpine:latest
  script:
    - apk add --no-cache git
    - git fetch -a
    - >
      ./scripts/git-verify-size.sh
      remotes/origin/$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
      remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build backend base:
  stage: build before
  image: docker:29
  extends: .docker login
  script:
    - >
      docker buildx build
      -t $CI_REGISTRY_IMAGE/backend-base:$IMAGE_VERSION
      --push --provenance=false --target base ./backend
  rules:
    - if: $VERSION

build frontend base:
  stage: build before
  image: docker:29
  extends: .docker login
  script: 
    - >
      docker buildx build 
      -t $CI_REGISTRY_IMAGE/frontend-base:$IMAGE_VERSION
      --push --provenance=false --target base ./frontend
  rules:
    - if: $VERSION




.lint base:
  stage: lint
  before_script: cd /app
  script:
    - pnpm lint
  allow_failure: true # TODO: remove once issues are fixed
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $VERSION

lint frontend:
  extends: .lint base
  image: $CI_REGISTRY_IMAGE/frontend-base:$IMAGE_VERSION

lint backend:
  extends: .lint base
  image: $CI_REGISTRY_IMAGE/backend-base:$IMAGE_VERSION


build backend:
  stage: build
  image: docker:29
  extends: .docker login
  script: 
    - >
      docker buildx build
      -t $CI_REGISTRY_IMAGE/backend:$IMAGE_VERSION
      --push --provenance=false --target backend ./backend
  rules:
    - if: $VERSION

build mcp:
  stage: build
  image: docker:29
  extends: .docker login
  script:
    - >
      docker buildx build
      -t $CI_REGISTRY_IMAGE/mcp:$IMAGE_VERSION
      --push --provenance=false --target mcp ./backend
  rules:
    - if: $VERSION


build frontend:
  stage: build
  image: docker:29
  extends: .docker login
  variables:
    NEXT_PUBLIC_API_URL: https://${VERSION}-adulting.cc.k3s.chas-lab.dev/backend
    NEXT_PUBLIC_AUTH_URL: https://${VERSION}-adulting.cc.k3s.chas-lab.dev/backend/api/auth
  script:
    - echo "client URL will be '$NEXT_PUBLIC_API_URL'"
    - echo "auth URL will be '$NEXT_PUBLIC_AUTH_URL'"
    - >
      docker buildx build
      --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
      --build-arg NEXT_PUBLIC_AUTH_URL=$NEXT_PUBLIC_AUTH_URL
      -t $CI_REGISTRY_IMAGE/frontend:$IMAGE_VERSION
      --push --provenance=false ./frontend
  rules:
    - if: $VERSION


deploy app static:
  stage: deploy
  image: $CI_REGISTRY_IMAGE/util:latest
  extends: .kubeconfig setup
  environment:
    name: $VERSION
    url: https://$VERSION-adulting.cc.k3s.chas-lab.dev
  rules:
    - if: $VERSION == "main" && $VERSION == "latest"
  script:
    - ./scripts/apply-secrets-if-not-exist.sh
    - cd deploy/app
    - kustomize edit set nameprefix "${VERSION}-adulting-"
    - kustomize edit set image $CI_REGISTRY_IMAGE/backend:$IMAGE_VERSION
    - kustomize edit set image $CI_REGISTRY_IMAGE/backend-base:$IMAGE_VERSION
    - kustomize edit set image $CI_REGISTRY_IMAGE/frontend:$IMAGE_VERSION
    - sed -i "s/asdf/${VERSION}/g" *
    - echo "replaced 'asdf' with '${VERSION}'"
    - cd -
    - kubectl apply -k deploy

deploy app dynamic:
  extends: deploy app static
  environment:
    name: review/$VERSION
    on_stop: delete env
  rules:
    - if: $VERSION && $VERSION != "main" && $VERSION != "latest"


delete env:
  stage: cleanup
  image: $CI_REGISTRY_IMAGE/util:latest
  extends: .kubeconfig setup
  environment:
    name: review/$VERSION
    action: stop
  rules:
    - if: $VERSION
      when: manual
  script: ./scripts/delete-resources.sh persistentvolumeclaim

stages:
  - check
  - build before
  - lint
  - build
  - deploy

variables:
  VERSION: $CI_COMMIT_REF_SLUG
workflow:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        VERSION: latest
    - when: always

.docker login:
  before_script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD

.kubeconfig setup:
  before_script:
    - mkdir "$HOME/.kube"
    - echo "$KUBECONFIG_CONTENT" | base64 -d > "$HOME/.kube/config"

build util image:
  stage: build before
  image: docker:29
  extends: .docker login
  script: docker buildx build -t $CI_REGISTRY_IMAGE/util:latest --push -f ./docker/util.Dockerfile .
  rules:
    - changes: 
      - docker/util.Dockerfile

check gitignore:
  stage: check
  image: alpine:latest
  script:
    - apk add --no-cache git
    - ./scripts/git-verify-ignore.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

check git size diff:
  stage: check
  image: alpine:latest
  script:
    - apk add --no-cache git
    - git fetch -a
    - ./scripts/git-verify-size.sh remotes/origin/$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build backend test:
  stage: build before
  image: docker:29
  extends: .docker login
  script: docker buildx build -t $CI_REGISTRY_IMAGE/backend-test:$VERSION --push ./backend

build frontend test:
  stage: build before
  image: docker:29
  extends: .docker login
  script: docker buildx build -t $CI_REGISTRY_IMAGE/frontend-test:$VERSION --push ./frontend


lint frontend:
  stage: lint
  image: $CI_REGISTRY_IMAGE/frontend-test:$VERSION
  before_script: cd /app
  script: pnpm dlx eslint .
  allow_failure: true # TODO: remove once issues are fixed
  variables:
    GIT_STRATEGY: none

lint backend:
  stage: lint
  image: $CI_REGISTRY_IMAGE/backend-test:$VERSION
  before_script: cd /app
  script: pnpm dlx eslint .
  allow_failure: true # TODO: remove once issues are fixed
  variables:
    GIT_STRATEGY: none


build backend:
  stage: build
  image: docker:29
  extends: .docker login
  script: docker buildx build -t $CI_REGISTRY_IMAGE/backend:$VERSION --push -f ./backend/prod.Dockerfile ./backend

build frontend:
  stage: build
  image: docker:29
  extends: .docker login
  script: docker buildx build -t $CI_REGISTRY_IMAGE/frontend:$VERSION --push -f ./frontend/prod.Dockerfile ./frontend


deploy app:
  stage: deploy
  image: $CI_REGISTRY_IMAGE/util:latest
  extends: .kubeconfig setup
  script:
    - ./scripts/inject-passwords.sh ./deploy/app/secret-auth.yml
    - ./scripts/inject-passwords.sh ./deploy/app/secret-postgres.yml
    - cd deploy/app
    - kustomize edit set nameprefix "${CI_COMMIT_SHORT_SHA}-0-"
    - kustomize edit set image $CI_REGISTRY_IMAGE/backend:$VERSION
    - kustomize edit set image $CI_REGISTRY_IMAGE/frontend:$VERSION
    - sed -i "s/asdf/${CI_COMMIT_SHORT_SHA}/" *
    - cd -
    - kubectl apply -k deploy

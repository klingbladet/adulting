stages:
  - check
  - build before
  - lint
  - build
  - deploy
  - cleanup

workflow:
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        VERSION: latest
    - if: $CI_COMMIT_REF_NAME == "main"
      variables:
        VERSION: main
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        VERSION: mr$CI_MERGE_REQUEST_IID
    - when: always

.docker login:
  before_script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD

.kubeconfig setup:
  before_script:
    - mkdir "$HOME/.kube"
    - echo "$KUBECONFIG_CONTENT" | base64 -d > "$HOME/.kube/config"

build util image:
  stage: build before
  image: docker:29
  extends: .docker login
  script: docker buildx build -t $CI_REGISTRY_IMAGE/util:latest --push -f ./docker/util.Dockerfile .
  rules:
    - changes: 
      - docker/util.Dockerfile

check gitignore:
  stage: check
  image: alpine:latest
  script:
    - apk add --no-cache git
    - ./scripts/git-verify-ignore.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

check git size diff:
  stage: check
  image: alpine:latest
  script:
    - apk add --no-cache git
    - git fetch -a
    - ./scripts/git-verify-size.sh remotes/origin/$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build backend base:
  stage: build before
  image: docker:29
  extends: .docker login
  script: docker buildx build -t $CI_REGISTRY_IMAGE/backend-base:$VERSION --push --target base ./backend
  rules:
    - if: $VERSION

build frontend base:
  stage: build before
  image: docker:29
  extends: .docker login
  script: docker buildx build -t $CI_REGISTRY_IMAGE/frontend-base:$VERSION --push --target base ./frontend
  rules:
    - if: $VERSION


lint frontend:
  stage: lint
  image: $CI_REGISTRY_IMAGE/frontend-base:$VERSION
  before_script: cd /app
  script:
    - pnpm lint
  allow_failure: true # TODO: remove once issues are fixed
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $VERSION

lint backend:
  stage: lint
  image: $CI_REGISTRY_IMAGE/backend-base:$VERSION
  before_script: cd /app
  script: 
    - pnpm eslint
  allow_failure: true # TODO: remove once issues are fixed
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $VERSION


build backend:
  stage: build
  image: docker:29
  extends: .docker login
  script: docker buildx build -t $CI_REGISTRY_IMAGE/backend:$VERSION --push ./backend
  rules:
    - if: $VERSION

build frontend:
  stage: build
  image: docker:29
  extends: .docker login
  variables:
    NEXT_PUBLIC_API_URL: https://${VERSION}-adulting.cc.k3s.chas-lab.dev/backend
    NEXT_PUBLIC_AUTH_URL: https://${VERSION}-adulting.cc.k3s.chas-lab.dev/backend/api/auth
  script:
    - echo "client URL will be '$NEXT_PUBLIC_API_URL'" 
    - echo "auth URL will be '$NEXT_PUBLIC_AUTH_URL'"
    - docker buildx build --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL --build-arg NEXT_PUBLIC_AUTH_URL=$NEXT_PUBLIC_AUTH_URL -t $CI_REGISTRY_IMAGE/frontend:$VERSION --push ./frontend
  rules:
    - if: $VERSION


deploy app:
  stage: deploy
  image: $CI_REGISTRY_IMAGE/util:latest
  extends: .kubeconfig setup
  environment:
    name: adulting/$VERSION
    url: https://$VERSION-adulting.cc.k3s.chas-lab.dev
    on_stop: delete env
  rules:
    - if: $VERSION
  script:
    - ./scripts/inject-passwords.sh ./deploy/app/secret-auth.yml
    - ./scripts/inject-passwords.sh ./deploy/app/secret-postgres.yml
    - cd deploy/app
    - kustomize edit set nameprefix "${VERSION}-0-adulting-"
    - kustomize edit set image $CI_REGISTRY_IMAGE/backend:$VERSION
    - kustomize edit set image $CI_REGISTRY_IMAGE/backend-base:$VERSION
    - kustomize edit set image $CI_REGISTRY_IMAGE/frontend:$VERSION
    - sed -i "s/asdf/${VERSION}/g" *
    - cd -
    - kubectl apply -k deploy


delete env:
  stage: cleanup
  image: $CI_REGISTRY_IMAGE/util:latest
  extends: .kubeconfig setup
  environment:
    name: adulting/$VERSION
    action: stop
  rules:
    - if: $VERSION
      when: manual
  script: ./scripts/delete-resources.sh

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
spec:
  stripPrefix:
    prefixes:
      - /backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: doe25-group-1-asdf-adulting-strip-auth@kubernetescrd
spec:
  rules:
  - host: asdf-adulting.cc.k3s.chas-lab.dev
    http:
      paths:
        - path: /backend
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 8080
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-dbui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  rules:
  - host: asdf-adulting-dbui.cc.k3s.chas-lab.dev
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: dbui
              port:
                number: 8080

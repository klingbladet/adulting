apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      adulting: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        adulting: frontend
    spec:
      imagePullSecrets:
        - name: registry-credentials
      resources:
        requests:
          cpu: 10m
          memory: 70Mi
        limits:
          cpu: 500m
          memory: 300Mi
      initContainers:
        - name: wait-backend
          image: alpine:latest
          env:
            - name: VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['env']
          command: ["sh", "-c"]
          args:
            - |
              echo "waiting for http://${VERSION}-adulting-backend.doe25-group-1.svc.cluster.local:8080/health"
              until wget -T 1 --spider http://${VERSION}-adulting-backend.doe25-group-1.svc.cluster.local:8080/health; do
                sleep 1
              done
      containers:
        - name: frontend
          image: registry.chas-lab.dev/chas-challenge-2026/grupp-1/adulting/frontend:feature-linter
          imagePullPolicy: Always
          env:
            - name: VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['env']
            - name: HOSTNAME
              value: 0.0.0.0
            - name: BACKEND_URL
              value: http://$(VERSION)-adulting-backend.doe25-group-1.svc.cluster.local:8080

            - name: NEXT_PUBLIC_BACKEND_URL
              value: https://$(VERSION)-adulting.cc.k3s.chas-lab.dev/backend
            - name: NEXT_PUBLIC_API_URL
              value: https://$(VERSION)-adulting.cc.k3s.chas-lab.dev/backend
            - name: NEXT_PUBLIC_API_BASE_URL
              value: https://$(VERSION)-adulting.cc.k3s.chas-lab.dev/backend
          ports:
            - containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              port: 3000
            periodSeconds: 1
            failureThreshold: 60
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              port: 3000
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    adulting: frontend
  ports:
    - port: 8080
      targetPort: 3000
      protocol: TCP

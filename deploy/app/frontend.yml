apiVersion: apps/v1
kind: Deployment
metadata:
  name: adulting-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      adulting: frontend
  template:
    metadata:
      labels:
        adulting: frontend
    spec:
      imagePullSecrets:
        - name: registry-credentials
      initContainers:
        - name: wait-backend
          image: alpine:latest
          command: ["sh", "-c"]
          args:
            - |
              until wget -q --spider http://asdf-0-adulting-backend.doe25-group-1.svc.cluster.local:8080/health; do
                sleep 1
              done
      containers:
        - name: adulting-frontend
          image: registry.chas-lab.dev/chas-challenge-2026/grupp-1/adulting/frontend:feature-linter
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 5
          readinessProbe:
            httpGet:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 5

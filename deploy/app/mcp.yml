
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
spec:
  replicas: 3
  selector:
    matchLabels:
      adulting: mcp 
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        adulting: mcp
    spec:
      imagePullSecrets:
        - name: registry-credentials
      resources:
        # requests:
        #   cpu: 5m
        #   memory: 65Mi
        # limits:
        #   cpu: 300m
        #   memory: 200Mi
      containers:
        - name: backend
          image: registry.chas-lab.dev/chas-challenge-2026/grupp-1/adulting/mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
              protocol: TCP
          env:
            - name: VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['env']
            - name: BETTER_AUTH_URL
              value: http://$(VERSION)-adulting-backend.doe25-group-1.svc.cluster.local:8080
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(VERSION)-adulting-postgres-0.$(VERSION)-adulting-postgres.doe25-group-1.svc.cluster.local:5432/$(POSTGRES_DB)
            - name: MCP_PORT
              value: "3003"
            - name: MCP_HOST
              value: 0.0.0.0
            - name: LEARNING_LESSON_PROVIDER
              value: database
            - name: LEARNING_PROFILE_PROVIDER
              value: mock
          envFrom:
            - secretRef:
                name: env-auth
                optional: false
            - secretRef: 
                name: env-postgres
                optional: false
            - secretRef:
                name: openrouter-api-key
                optional: false
            - configMapRef:
                name: env-openrouter
                optional: false
          startupProbe:
            httpGet:
              port: 3003
              path: /health
            periodSeconds: 1
            failureThreshold: 60
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              port: 3003
              path: /health
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              port: 3003
              path: /health
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    adulting: mcp
  ports:
    - port: 8080
      targetPort: 3003
      protocol: TCP

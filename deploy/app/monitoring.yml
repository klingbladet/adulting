apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels:
    adulting: monitoring
spec:
  selector:
    matchLabels:
      adulting: backend
  endpoints:
    - port: "8080"
      path: /metrics
      interval: 15s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashbaord
  labels:
    grafana_dashboard: "1"
data:
  adulting-dashboard.json: |
    {
      "title": "adulting (group 1)",
      "uid": "adulting-group1",
      "schemaVersion": 1,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "tags": ["chas-academy", "doe25", "doe25-group-1"],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate (req/s) by endpoint",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum by (endpoint) (rate(adulting_backend_http_requests_total{namespace=\"doe25-group-1\",route!=\"/metrics\"}[1m]))",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error rate (5xx, share of total)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(adulting_backend_http_requests_total{namespace=\"doe25-group-1\",status_code=~\"5..\",route!=\"/metrics\"}[5m])) / clamp_min(sum(rate(adulting_backend_http_requests_total{namespace=\"doe25-group-1\",route!=\"/metrics\"}[5m])), 1)",
              "legendFormat": "5xx ratio",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency p95 (s) by endpoint",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (endpoint, le) (rate(adulting_backend_http_request_duration_seconds_bucket{namespace=\"doe25-group-1\",route!=\"/metrics\"}[5m])))",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Requests last 5m by status_code",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum by (status_code) (increase(adulting_backend_http_requests_total{namespace=\"doe25-group-1\",route!=\"/metrics\"}[5m]))",
              "legendFormat": "{{status_code}}",
              "refId": "A"
            }
          ]
        }
      ]
    }

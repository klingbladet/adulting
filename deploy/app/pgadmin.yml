apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-config
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "Something",
          "Group": "asdf",
          "Username": "POSTGRES_USER",
          "Port": 5432,
          "Host": "VERSION-adulting-postgres-0.VERSION-adulting-postgres.doe25-group-1.svc.cluster.local",
          "MaintenanceDB": "postgres"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      adulting: pgadmin
  template:
    metadata:
      labels:
        adulting: pgadmin
    spec:
      volumes:
        - name: pgadmin-config
          configMap:
            name: pgadmin-config
        - name: overrides
          emptyDir: {}
      initContainers:
        - name: generate-servers
          image: busybox
          command: ["sh", "-c"]
          env:
            - name: VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['env']
          envFrom:
            - secretRef: 
                name: env-postgres
                optional: false
          volumeMounts:
            - name: pgadmin-config
              mountPath: /config
            - name: overrides
              mountPath: /pgadmin4
          args:
            - |
              echo "populating servers.json and adding it to /pgadmin4"
              sed \
                -e "s/VERSION/${VERSION}/g" \
                -e "s/POSTGRES_USER/${POSTGRES_USER}/g" \
                /config/servers.json | tee /pgadmin4/servers.json
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@admin.lan
            - name: PGADMIN_DEFAULT_PASSWORD
              value: strongpassword
          volumeMounts:
            - name: overrides
              mountPath: /pgadmin4
          startupProbe:
            httpGet:
              port: 80
            periodSeconds: 2
            failureThreshold: 120
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              port: 80
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              port: 80
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
spec:
  selector:
    adulting: pgadmin
  ports:
    - port: 8080
      targetPort: 80
      protocol: TCP

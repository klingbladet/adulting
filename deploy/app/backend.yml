apiVersion: apps/v1
kind: Deployment
metadata:
  name: adulting-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      adulting: backend
  template:
    metadata:
      labels:
        adulting: backend
    spec:
      containers:
        - name: adulting-backend
          image: registry.chas-lab.dev/chas-challenge-2026/grupp-1/adulting/backend:latest
          imagePullPolicy: Always
      imagePullSecrets:
        - name: registry-credentials

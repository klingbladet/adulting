apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      adulting: backend
  template:
    metadata:
      labels:
        adulting: backend
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: backend
          image: registry.chas-lab.dev/chas-challenge-2026/grupp-1/adulting/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              protocol: TCP
          env:
            - name: BETTER_AUTH_URL
              value: http://localhost:3001
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@asdf-0-adulting-postgres-0.asdf-0-adulting-postgres.doe25-group-1.svc.cluster.local:5432/$(POSTGRES_DB)
          envFrom:
            - secretRef:
                name: env-auth
                optional: false
            - secretRef: 
                name: env-postgres
                optional: false
          startupProbe:
            httpGet:
              port: 3001
              path: /health
            periodSeconds: 1
            failureThreshold: 60
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              port: 3001
              path: /health
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              port: 3001
              path: /health
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    adulting: backend
  ports:
    - port: 8080
      targetPort: 3001
      protocol: TCP

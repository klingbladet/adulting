apiVersion: apps/v1
kind: Deployment
metadata:
  name: adulting-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      adulting: backend
  template:
    metadata:
      labels:
        adulting: backend
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: adulting-backend
          image: registry.chas-lab.dev/chas-challenge-2026/grupp-1/adulting/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              protocol: TCP
          env:
            - name: BETTER_AUTH_URL
              value: http://localhost:3001
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@asdf-0-postgres-0.asdf-0-postgres.doe25-group-1.svc.cluster.local:5432/$(POSTGRES_DB)
          envFrom:
            - secretRef:
                name: env-auth
                optional: false
            - secretRef: 
                name: env-postgres
                optional: false
          livenessProbe:
            httpGet:
              port: 3001
              path: /health
            initialDelaySeconds: 20
            periodSeconds: 5
          readinessProbe:
            httpGet:
              port: 3001
              path: /health
            initialDelaySeconds: 20
            periodSeconds: 5

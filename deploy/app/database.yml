apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      adulting: db
  serviceName: postgres
  template:
    metadata:
      labels:
        adulting: db
    spec:
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: env-postgres
                optional: false
          ports:
            - containerPort: 5432
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    adulting: db

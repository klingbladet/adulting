services:
  frontend:
    build: ./frontend
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build: ./backend
    ports:
      - 3001:3001
    volumes:
      - backend_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:3001
    depends_on:
      - migrate-db
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore: 
            - node_modules
        - action: rebuild
          path: package.json

  migrate-db:
    build:
      context: ./backend
      dockerfile: ./drizzle.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    entrypoint: ["pnpm", "push"]
    volumes:
      - db-migrations:/app/drizzle
  drizzle:
    build:
      context: ./backend
      dockerfile: ./drizzle.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - backend
    ports:
      - 4983:4983
    entrypoint: ["pnpm", "drizzle-kit", "studio", "--host", "0.0.0.0"]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql/18/docker
volumes:
  db-migrations:
  db:
  frontend_node_modules:
  backend_node_modules:

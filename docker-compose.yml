services:
  frontend:
    build: ./frontend
    ports:
      - 3000:3000

  backend:
    build: ./backend
    ports:
      - 3001:3001
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
    depends_on:
      - migrate-db

  migrate-db:
    build: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    entrypoint:
      - ./generate_and_migrate.sh
    volumes:
      - db-migrations:/app/drizzle
  drizzle:
    build: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - backend
    ports:
      - 4983:4983
    entrypoint: [pnpm, drizzle-kit, studio]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: asdf
      POSTGRES_USER: postgres
      POSTGRES_DB: mydb
    ports:
      - 5432:5432
volumes:
  db-migrations:

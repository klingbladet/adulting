services:
  frontend:
    build: ./frontend
    ports:
      - 3000:3000
    command: ["pnpm", "run", "dev"]
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - node_modules
            - .next
        - action: rebuild
          path: ./frontend/package.json

  backend:
    build: ./backend
    ports:
      - 3001:3001
    command: ["pnpm", "run", "dev"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:3001
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
    depends_on:
      - migrate-db
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - node_modules
            - .next
        - action: rebuild
          path: ./backend/package.json

  migrate-db:
    build:
      context: ./backend
      dockerfile: ./drizzle.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    entrypoint: ["pnpm", "push"]
    volumes:
      - db-migrations:/app/drizzle

  drizzle:
    build:
      context: ./backend
      dockerfile: ./drizzle.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - backend
    ports:
      - "4983:4983"
    entrypoint: ["pnpm", "drizzle-kit", "studio", "--host", "0.0.0.0"]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 10s
      start_interval: 1s
      interval: 5s
      timeout: 2s
      retries: 3

volumes:
  db-migrations:
  db:
